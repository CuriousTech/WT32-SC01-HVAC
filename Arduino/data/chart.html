<!DOCTYPE html>
<html>
<head>
<title>HVAC Chart</title>
<link rel="stylesheet" type="text/css" href="styles.css">
<style type="text/css">
div{
border-radius: 1px;
margin-bottom: 1px;
box-shadow: 2px 2px 12px #000000;
background: rgb(160,160,160);
background: linear-gradient(0deg, rgba(160,160,160,1) 0%, rgba(176,176,176,1) 100%);
background-clip: padding-box;
}
.dropdown{
 position: relative;
 display: inline-block;
}
.btn{
 background-color: #a0a0a0;
 padding: 1px;
 font-size: 12px;
 min-width: 40px;
 border: none;
}
.dropdown-content{
 display: none;
 position: absolute;
 min-width: 40px;
 min-height: 1px;
 z-index: 1;
}
.dropdown:hover .dropdown-content{display: block;}
body{background:silver;width:700px;display:block;text-align:center;font-family: Arial, Helvetica, sans-serif;}
</style>
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.1/jquery.min.js" type="text/javascript" charset="utf-8"></script>
<script type="text/javascript">
var graph;
xPadding=30
yPadding=56
drawMode=3
schedMode=1
histLen=640
const histSize=16
var _minY
var _maxY
var yRange
var Json
var a=document.all
var ws
cnt=0
histIdx=0
histView = 0
added=false
var dispYear
var dispMon
clrs=['#00f','#fff','#000','#fa0','rgba(50,50,255,0.5)','rgba(255,155,255,0.7)','rgba(0,50,50,0.6)','rgba(55,0,255,0.7)','rgba(255,156,10,0.7)']

$(document).ready(function()
{
 myStorage1 = localStorage.getItem('myStoredText1')
 if(myStorage1  != null) myToken=myStorage1
 relPath = location.href.replace(/^https?:\/\/|[^/]*$/gi, "")
 ws = new WebSocket("ws://"+relPath+"ws")
// ws=new WebSocket("ws://192.168.31.112/ws")
 ws.binaryType="arraybuffer"
 date=new Date()
 dispYear=date.getFullYear()
 dispMon=date.getMonth()+1
 ws.onopen=function(evt){ws.send('{"sum":0}');setVar('cd','/')}
 ws.onclose=function(evt){alert("Connection closed.")}
 ws.onmessage = function(evt){
	if(evt.data instanceof ArrayBuffer){
		if(event.data.byteLength == histSize)
		{
			part = new DataView(evt.data)
			if(++histIdx>=histLen) histIdx=0
			for(i=0;i<histSize;i++)
				histView.setUint8(histIdx*histSize+i,part.getUint8(i))
			if(tempCnt<histLen) tempCnt++
		}else{
			histLen=event.data.byteLength/histSize
			histView = new DataView(evt.data)
			tempCnt=(getTemp(histLen-1))?histLen:histIdx
		}
		draw()
		return
    }
	console.log(evt.data)
	Json=JSON.parse(evt.data)
	switch(Json.cmd)
	{
		case 'settings':
			ppkwh=+Json.ppk/1000
			ccf=+Json.ccf/1000
			cfm=+Json.cfm/1000
			cw=+Json.cw
			fw=+Json.fw
			frnw=+Json.frnw
			md=+Json.m
			dl=+Json.dl
			schedMode=+Json.sm
			fco=+Json.fco
			so=+Json.so
			if(schedMode==0) a.fco.value=fco
			else a.fco.value=so
			a.fcr.value=fcr=+Json.fcr
			ct=+Json.ct
			c0=+Json.c0
			c1=+Json.c1
			h0=+Json.h0
			h1=+Json.h1
			a.lo.value=(iMin=(md==2)?h0:c0)/10
			a.hi.value=(iMax=(md==2)?h1:c1)/10
			a.ct.value=ct/10
			break
		case 'state':
			sJson=Json
			cyc=secsToTime(+Json.ct)
			snd=Json.snd
			break
		case 'alert':
			alert(Json.text)
			break
		case 'print':
			break
		case 'sum':
			dys=Json.day
			mns=Json.mon
			fc=Json.fc
			fcDate=Json.fcDate
			fcFreq=Json.fcFreq
			histIdx=Json.idx-1
			if(histIdx<0) histIdx+=histLen
			tb=Json.tb
			th=Json.th
			ws.send('{bin:2}')
			draw_bars()
			drawFC()
			break
		case 'update':
			switch(Json.type)
			{
			  case 'day':
				dys[Json.e][0]=+Json.d0
				dys[Json.e][1]=+Json.d1
				dys[Json.e][2]=+Json.d2
				break
			}
			draw_bars()
			break
		case 'files':
		    Json.list.sort(function(a1, b1) {
		      n=a1[0].toLowerCase().localeCompare(b1[0].toLowerCase())
		      if(a1[2]) n-=10
		      if(b1[2]) n+=10
		      return n
		    });
		    files=Json.list
	}
 }
 setInterval(function(){
	index=histIdx+1
	if(index>=histLen) index=0
	ws.send('{data:'+index+'}'); },60000)
});

function nav(n)
{
  nMon=dispMon+n
  nYear=dispYear
  if(nMon>12){nMon-=12;nYear++}
  if(nMon<=0){nMon+=12;nYear--}
  val=(nYear<<4)+nMon
  name = 'statsday'+nYear+'.'+nMon+'.dat'
  if(files.some(row => row.includes(name ))){
    ws.send('{"sum":'+val+'}')
    dispYear=nYear
    dispMon=nMon
  }
}

function draw(){
  graph = $('#graph')
  c=graph[0].getContext('2d')
  
  tipCanvas=document.getElementById("tip")
  tipCtx=tipCanvas.getContext("2d")

  c.fillStyle='black'
  c.strokeStyle='black'
  canvasOffset=graph.offset()
  offsetX=canvasOffset.left
  offsetY=canvasOffset.top
  h=graph.height()-yPadding
  c.lineWidth=2
  c.font='italic 8pt sans-serif'
  c.textAlign="left"
  yPad=yPadding
  doBorder(graph)

  c.lineWidth = 1
  // dates
  if(tempCnt<2) return
  _minY=getMinY()
  _maxY=getMaxY()
  yRange=_maxY-_minY

  step=Math.floor(tempCnt/15)
  if(step==0) step=1
  idx=histIdx
  tm=tb
  n=step
  for(i=0;i<tempCnt;i++){
	date = new Date(tm*1000)
	tm-=getTmOff(idx)

	if(n>1) n--
	else{
		n=step
		c.save()
		c.translate(getXPixel(i),h+5)
		c.rotate(0.9)
		c.fillText(date.toLocaleTimeString(),0,0)
		c.restore()
	}
	if(--idx<0) idx+=histLen
  }

  // value range
  c.textAlign="right"
  c.textBaseline="middle"

  for(var i=_minY;i<_maxY;i+=(yRange/8))
	c.fillText((i/10).toFixed(1),graph.width()-6,getYPixel(i))

  c.fillText('TEMP', graph.width(),6)
  c.fillStyle = +sJson.r?(md==2?"red":"blue"):(+sJson.fr?"green":"slategray")
  c.fillText((+sJson.it/10).toFixed(1),graph.width()-6,getYPixel(+sJson.it) )
 // cycle
  c.fillText(cyc,graph.width()-xPadding-7,h-8)

  c.fillStyle="green"
  c.fillText('RH',xPadding-6,6)

  // rh scale
  for(i=0;i<10;i++){
	pos=h-8-((h/10)*i)
	c.fillText(i*10,xPadding-4,pos)
  }

  //threshold
  c.fillStyle = 'rgba(100,100,180,0.25)'
  c.beginPath()
  c.moveTo(getXPixel(0),getYPixel(gettarget(histIdx)+th))
  idx=histIdx-1
  if(idx<0) idx+=histLen
  for(i=1;i<tempCnt;i++)
  {
	c.lineTo(getXPixel(i),getYPixel(gettarget(idx)+th))
	if(--idx<0) idx+=histLen
  }
  if(++idx>=histLen) idx=0
  for(i=tempCnt-1;i>=0;i--)
  {
	c.lineTo(getXPixel(i),getYPixel(gettarget(idx)))
	if(++idx>=histLen) idx=0
  }
  c.closePath()
  c.fill()
  // temp lines
  if(drawMode&1)
  {
   date=new Date(tb*1000)
   tm=tb
   dt=date.getDate()
   idx=histIdx-1
   if(idx<0) idx+=histLen
   for(i=1;i<tempCnt-1;i++){
	c.strokeStyle=stateColor( histView.getUint8(idx*histSize+4)&0xf )
	c.beginPath()
	c.moveTo(getXPixel(i),getYPixel( getTemp(idx) ))
	idx2=idx+1
	if(idx2>=histLen) idx2=0
	c.lineTo(getXPixel(i-1),getYPixel( getTemp(idx2) ))
	c.stroke()
	tm-=getTmOff(idx)
	date=new Date(tm*1000)
	if(dt!=date.getDate()) // next day
	{
	  dt = date.getDate()
	  c.strokeStyle = '#000'
	  c.beginPath() // borders
	  c.moveTo(getXPixel(i),0)
	  c.lineTo(getXPixel(i),h)
	  c.stroke()
	}
	if(--idx<0) idx+=histLen
   }
  }
  sh=8
  for(i1=1;i1<8;i1++)
  {
	if(drawMode&sh)
	   doLines(clrs[i1-1],i1)
	sh<<=1
  }
  for(i=0;i<7;i++)
  {
    itm=document.getElementById('L'+(i+3))
    itm.style="color:"+clrs[i]
	if(typeof snd[i] !== "undefined")
	    itm.innerText=snd[i][4]
  }

  // out temp
  if(drawMode&4) doLines('#ff0',0)
  if(drawMode&2){
	c.strokeStyle = '#0f0'
	c.beginPath()
	c.moveTo(getXPixel(0),getRHPixel( getRh(histIdx) ))
	idx=histIdx
	for(i=1;i<tempCnt;i ++)
	{
		if(--idx<0) idx+=histLen
		c.lineTo(getXPixel(i),getRHPixel( getRh(idx) ))
	}
	c.stroke()
  }
  dots=[]
    idx=histIdx
	dt=tb
	for(i=0;i<tempCnt;i++){
		inTemp=getTemp(idx)
		dots.push({
			x: getXPixel(i),
			y: getYPixel(inTemp),
			r: 4,
			rXr: 16,
			color: "red",
			tip: (new Date(dt*1000)).toLocaleTimeString()+' ',
			tip2: inTemp/10,
			tip3: (getRh(idx))/10,
			tip4: ((histView.getInt32(idx*histSize,true)>>21)&0x7ff)/10
		})
		dt-=getTmOff(idx)
		if(--idx<0) idx+=histLen
	}

	// request mousemove events
	graph.mousemove(function(e){handleMouseMove(e);})

	// show tooltip when mouse hovers over dot
	function handleMouseMove(e){
		mouseX=parseInt(e.clientX-offsetX)
		mouseY=parseInt(e.clientY-offsetY)

		// Put your mousemove stuff here
		var hit=false
		for(i=0;i<dots.length;i++){
			dot=dots[i]
			dx=mouseX-dot.x
			dy=mouseY-dot.y
			if(dx*dx+dy*dy<dot.rXr){
				tipCtx.clearRect(0,0,tipCanvas.width,tipCanvas.height)
				tipCtx.lineWidth=2
				tipCtx.fillStyle="#000000"
				tipCtx.strokeStyle='#333'
				tipCtx.font='italic 8pt sans-serif'
				tipCtx.textAlign="left"

				tipCtx.fillText(dot.tip,4,15)
				tipCtx.fillText('In:'+dot.tip2+'°F',4,29)
				tipCtx.fillText(dot.tip3+'%',4,44)
				tipCtx.fillText('Out:'+dot.tip4 + '°F',4,58)
				hit=true
				popup=document.getElementById("popup")
				popup.style.top=dot.y+"px"
				popup.style.left=(dot.x-70)+"px"
			}
		}
		if(!hit){popup.style.left="-200px"}
	}

	function doLines(ss,os)
	{
		c.strokeStyle=ss
		c.beginPath()
		ixx=histIdx
		ofs=ixx*histSize+7
		temp=getTemp(ixx)
		sens = new Array(getOutTemp(ixx), histView.getInt8(ofs)+temp,histView.getInt8(ofs+1)+temp,histView.getInt8(ofs+2)+temp,histView.getInt8(ofs+3)+temp,histView.getInt8(ofs+4)+temp,histView.getInt8(ofs+5)+temp,histView.getInt8(ofs+6)+temp)
		c.moveTo(getXPixel(0),getYPixel(sens[os]))
		if(sens[os]==0)
			return
		for(i=1;i<tempCnt;i++)
		{
			if(--ixx<0) ixx+=histLen
			ofs=ixx*histSize+7
			temp=getTemp(ixx)
			sens = new Array(getOutTemp(ixx), histView.getInt8(ofs)+temp,histView.getInt8(ofs+1)+temp,histView.getInt8(ofs+2)+temp,histView.getInt8(ofs+3)+temp,histView.getInt8(ofs+4)+temp,histView.getInt8(ofs+5)+temp,histView.getInt8(ofs+6)+temp)
			c.lineTo(getXPixel(i),getYPixel(sens[os]))
		}
		c.stroke()
	}
}

function getTmOff(o)
{
	return histView.getUint16(o*histSize+5,true)>>6&0x3ff
}

function getTemp(o)
{
	return histView.getUint16(o*histSize, true)&0x7ff
}

function getOutTemp(o)
{
	return histView.getUint16(o*histSize+2, true)>>5&0x7ff
}

function getRh(o)
{
	return (histView.getUint16(o*histSize+4, true)>>4)&0x3ff
}

function gettarget(o)
{
	return (histView.getUint16(o*histSize+1, true)>>3)&0x3ff
}

function getMaxY(){
	max=0
	ix=histIdx
	for(m=0;m<tempCnt-1;m++)
	{
		target=gettarget(ix)
		temp=getTemp(ix)
		ofs=ix*histSize+7
		sens = new Array(getOutTemp(ix),histView.getInt8(ofs)+temp,histView.getInt8(ofs+1)+temp,histView.getInt8(ofs+2)+temp,histView.getInt8(ofs+3)+temp,histView.getInt8(ofs+4)+temp,histView.getInt8(ofs+5)+temp,histView.getInt8(ofs+6)+temp)

		if(temp>max)
		  max=temp
		if(target+th>max)
		  max=target+th
		dm=drawMode>>2
		for(j=0;j<sens.length;j++)
		  if(dm&1<<j&&sens[j]>max)
			max=sens[j]
		if(--ix<0) ix+=histLen
	}
	return Math.ceil(max)
}

function getMinY(){
	min=1500
	ix=histIdx
	for(m=0;m<tempCnt-1;m++)
	{
		target=gettarget(ix)-1
		temp=getTemp(ix)
		ofs=ix*histSize+7
		sens = new Array(getOutTemp(ix),histView.getInt8(ofs)+temp,histView.getInt8(ofs+1)+temp,histView.getInt8(ofs+2)+temp,histView.getInt8(ofs+3)+temp,histView.getInt8(ofs+4)+temp,histView.getInt8(ofs+5)+temp,histView.getInt8(ofs+6)+temp)
		if(temp<min)
		  min=temp
		if(target<min)
		  min=target
		dm=drawMode>>2
		for(j=0;j<sens.length;j++)
		{
			if(dm&(1<<j)&&min>sens[j])
				min=sens[j]
		}
		if(--ix<0) ix+=histLen
	}
	return Math.floor(min)
}

function leg(id)
{
	drawMode^=1<<id
	draw()
}

function getXPixel(val){
	x=(graph.width()-xPadding)-((graph.width()-26-xPadding)/tempCnt)*val
	return x.toFixed()
}

function getYPixel(val){
	y=graph.height()-(((graph.height()-yPadding)/yRange)*(val-_minY))-yPadding
	return y.toFixed()
}

function getRHPixel(val){
	return graph.height()-(((graph.height()-yPadding)/1000)*val)-yPadding
}

function stateColor(s)
{
	sts=Array('gray','blue','yellow','red')
	if(s==1) return 'cyan'
	return sts[s>>1]
}

function setVar(varName,value)
{
	ws.send('{"key":"'+myToken+'","'+varName+'":'+value+'}')
}

function secsToTime(sec)
{
	dt=new Date(1970,0,1)
	dt.setSeconds(sec)
	d=dt.getDate()-1
	d=d?d+'d ':''
	return d+dt.toTimeString().replace(/.*(\d:\d{2}:\d{2}).*/, "$1")
}

function draw_bars()
{
	graph = $('#chart')
	var c=document.getElementById('chart')
	rect=c.getBoundingClientRect()
	canvasX=rect.x
	canvasY=rect.y

	tipCanvas=document.getElementById("tip")
	tipCtx=tipCanvas.getContext("2d")

	ctx=c.getContext("2d")
	ht=c.height/2
	ctx.fillStyle="#FFF"
	ctx.font="10px sans-serif"

	dots2=[]
	date=new Date()
	ctx.lineWidth=6
	draw_scale(dys,c.width-4,ht,2,1,date.getDate()-1)
	ctx.lineWidth=14
	draw_scale(mns,c.width-4,ht-2,ht+2,1,date.getMonth())

	a.year.innerHTML=dispYear+'.'+dispMon

	// request mousemove events
	graph.mousemove(function(e){handleMouseMove(e);})

	// show tooltip when mouse hovers over dot
	function handleMouseMove(e){
		rect=c.getBoundingClientRect()
		mouseX=e.clientX-rect.x
		mouseY=e.clientY-rect.y
		var hit = false
		for(i=0;i<dots2.length;i++){
			dot=dots2[i]
			if(mouseX>=dot.x && mouseX<=dot.x2 && mouseY>=dot.y && mouseY<=dot.y2){
				tipCtx.clearRect(0,0,tipCanvas.width, tipCanvas.height)
				tipCtx.fillStyle="#000000"
				tipCtx.strokeStyle='#333'
				tipCtx.font='italic 8pt sans-serif'
				tipCtx.textAlign="left"
				tipCtx.fillText(dot.tip, 4,15)
				tipCtx.fillText(dot.tip2,4,29)
				tipCtx.fillText(dot.tip3,4,44)
				tipCtx.fillText(dot.tip4,4,59)
				tipCtx.fillText(dot.tip5,4,75)
				hit=true
				popup=document.getElementById("popup")
				popup.style.top=(dot.y+rect.y+window.pageYOffset)+"px"
				x=dot.x+rect.x-60
				if(x<10)x=10
				popup.style.left=x+"px"
			}
		}
		if(!hit){popup.style.left="-200px"}
	}
}

function draw_scale(ar,w,h,o,p,ct)
{
	ctx.fillStyle="#336"
	ctx.fillRect(2,o,w,h-3)
	ctx.fillStyle="#FFF"
	max=[0,0,0]
	tot=[0,0,0,0,0]
	for(i=0;i<ar.length;i++)
	{
		if(ar[i][0]>max[0]) max[0]=ar[i][0]
		if(ar[i][1]>max[1]) max[1]=ar[i][1]
		if(ar[i][2]>max[0]) max[0]=ar[i][2]
		tot[0]+=ar[i][0]
		tot[1]+=ar[i][1]
		tot[2]+=ar[i][2]
	}
	max[2]=max[0]
	ctx.textAlign="center"
	lw=ctx.lineWidth
	clr=['#55F','#F55','#5F5']
	mbh=0
	for(i=0;i<ar.length;i++)
	{
		x=i*((w-40)/ar.length)+10
		for(j=0;j<3;j++)
		{
			ctx.strokeStyle=clr[j]
		    bh=ar[i][j]*(h-20)/max[j]
		    if(mbh<bh) mbh=bh
		    y=(o+h-20)-bh
			ctx.beginPath()
		    ctx.moveTo(x,o+h-20)
		    ctx.lineTo(x,y)
			ctx.stroke()
			x+=lw
		}

		ctx.fillStyle="#FFF"
		if(i==ct&&date.getMonth()+1==dispMon&&date.getFullYear()==dispYear)
		{
			ctx.strokeStyle="#fff"
			ctx.lineWidth=1
			ctx.beginPath()
		    ctx.moveTo(x-1,o+h-20)
		    ctx.lineTo(x-1,o)
			ctx.stroke()
			ctx.lineWidth=lw
			ctx.fillStyle="#FF0"
		}
		else if(ctx.lineWidth!=6&&i==dispMon-1)
			ctx.fillStyle="#FF0"
		ctx.fillText(i+p,x-lw*2,o+h-7)

		if(mbh<25) mbh=25
		costE=+(ppkwh*ar[i][0]*(cw/3600000))+(ppkwh*ar[i][2]*(fw/3600000))+(ppkwh*ar[i][1]*(frnw/3600000))
		costG=+(ccf*ar[i][1]*cfm)/3600
		tot[3]+=costE
		tot[4]+=costG
		if(ar[i][0]||ar[i][1]||ar[i][2])
		  dots2.push({
			x: x-lw*3,
			y: (o+h-20)-mbh,
			y2: (o+h),
			x2: x+ctx.lineWidth*1.5,
			tip: 'AC\t\t'+secsToTime(ar[i][0]),
			tip2: 'NG\t\t'+secsToTime(ar[i][1]),
			tip3: 'FAN\t\t'+secsToTime(ar[i][2]),
			tip4: 'Elec   $'+costE.toFixed(2),
			tip5: 'NG     $'+costG.toFixed(2)
		})
	}
	ctx.textAlign="right"
	ctx.fillText(secsToTime(tot[0]),w-1,o+10)
	ctx.fillText(secsToTime(tot[1]),w-1,o+21)
	ctx.fillText('$'+tot[3].toFixed(2),w-1,o+32)
	ctx.fillText('$'+tot[4].toFixed(2),w-1,o+43)
}

function doBorder(g)
{
	c.clearRect(0, 0, g.width(), g.height())
	c.beginPath()
	c.moveTo(xPadding,0)
	c.lineTo(xPadding,g.height()-yPad)
	c.lineTo(g.width()-xPadding, g.height()-yPad)
	c.lineTo(g.width()-xPadding, 0)
	c.stroke()
}

function drawFC(){
	graph2 = $('#graph2')
	c=graph2[0].getContext('2d')

	c.fillStyle='black'
	c.strokeStyle='black'
	canvasOffset=graph2.offset()
	offsetX=canvasOffset.left
	offsetY=canvasOffset.top
	yPad=18
	h18=graph2.height()-yPad
	if(fcr>fc.length) fcr=fc.length
	if(fcr==0) fcr=23
	c.lineWidth=2
	c.font='italic 8pt sans-serif'
	c.textAlign="left"

	doBorder(graph2)

	c.lineWidth=1
	min=1500
	max=-300
	for(i=0;i<fc.length;i++)
	{
		if(min>fc[i]/10) min=fc[i]/10
		if(max<fc[i]/10) max=fc[i]/10
	}
	max++
	yRange=max-min
	c.textAlign="right"
	c.textBaseline="middle"
	c.fillStyle='black'

	// right legend
	for(i=min;i<max;i+=(yRange/8))
		c.fillText(i.toFixed(1),graph2.width()-6,getYPixel2(i))
	c.fillText('OUT',graph2.width()-6,6)

	c.textAlign="left"
	if(iMax==iMin) iMax+=1
	iRng=iMax-iMin
	c.fillText(iMax/10,6,getYPixel3(iMax))
	c.fillText(iMin/10,6,getYPixel3(iMin))

	c.fillStyle='#40404050'
	w=graph2.width()-xPadding*2
	c.fillRect(xPadding,getYPixel3(iMax),w,getYPixel3(iMin)-getYPixel3(iMax))

	// temp lines
	c.fillStyle="red"
	fcl=fc.length
	if(fcl==0){
		fcl=58
		fcDate=(new Date()).valueOf()/1000-(60*60*24)
		fcFreq=10800
		fcr=23
	}
	cPos=0
	fl=(fcDate+fcFreq*(fcl-1))/60
	date=new Date(fcDate*1000)
	dt=date.getDate()
	grd=c.createLinearGradient(0,0,0,h18)
	if(max<=32) grd.addColorStop(0,"blue")
	else if(min<32)
	{
		fr=1-((32-min)/yRange)
		grd.addColorStop(fr,"red")
		grd.addColorStop(fr,"blue")
	}
	else{grd.addColorStop(0,"red");grd.addColorStop(1,"blue")}
	for(i=1;i<fcl;i++){
		if(fc.length){
			c.strokeStyle=grd
			c.beginPath()
			c.moveTo(getXPixel2(i),getYPixel2(fc[i]/10))
			c.lineTo(getXPixel2(i-1),getYPixel2(fc[i-1]/10))
			c.stroke()
		}
		date = new Date((fcDate+fcFreq*i)*1000)
		c.fillStyle='#000'
		if(cPos==0&&date.valueOf()>=(new Date()).valueOf())
		{
			dif=(date.valueOf()-(new Date().valueOf()))/60000
			xOff=w/fl*dif
			cPos=i;
			c.strokeStyle='#fff'
			c.beginPath()
			c.moveTo(getXPixel2(cPos)-xOff,h18)
			c.lineTo(getXPixel2(cPos)-xOff,1)
			c.stroke()
			c.textAlign="center"
			c.fillText("Now",getXPixel2(cPos)-xOff,getYPixel3(iMax)-8)
		}
		if(dt!=date.getDate()){
			dt=date.getDate()
			c.strokeStyle='#555'
			c.beginPath()
			c.moveTo(getXPixel2(i),0)
			c.lineTo(getXPixel2(i),h18)
			c.stroke()
			c.textAlign="left"
			c.fillText(date.toLocaleDateString(),getXPixel2(i),graph2.height()-8)
		}
	}
	xOff=0
	if(schedMode==0)
		xOff=w/((fcl-1)*(fcFreq/60))*fco
	c.fillStyle="#9050F090"
	c.beginPath()
	strt=cPos-fcr
	if(strt<0) strt=0
	date=new Date(fcDate*1000)
	c.moveTo(getXPixel2(strt)+xOff,getTT(strt,0))
	for(i=strt+1;i<=cPos+fcr;i++)
	{
		date=new Date((fcDate+(fcFreq*i))*1000)
		c.lineTo(getXPixel2(i)+xOff,getTT(i,0))
	}
	for(i=cPos+fcr;i>=strt;i--)
	{
		date=new Date((fcDate+(fcFreq*i))*1000)
		c.lineTo(getXPixel2(i)+xOff,getTT(i,ct))
	}
	c.closePath()
	c.fill()
}
function getXPixel2(val){
	x=xPadding+((graph2.width()-xPadding*2)/fcl)*val
	return +x.toFixed()
}

function getYPixel2(val){
	y=h18-((h18/yRange)*(val-min))
	return y.toFixed()
}
function getYPixel3(val){
	h=graph2.height()-18
	o=70+ct*2
	return h18-(o/2)-((h18-o)/iRng*(val-iMin))
}
function getTT(i,th)
{
 if(schedMode==0)
 {
	min2=1500
	max2=-300
	strt1=i-fcr
	if(strt1<0) strt1=0
	for(j=strt1;j<i+fcr;j++)
	{
		if(j<fc.length){
			if(min2>fc[j]/10) min2=fc[j]/10
			if(max2<fc[j]/10) max2=fc[j]/10
		}
	}
	tt=(fc[i]/10-min2)*iRng/(max2-min2)+iMin+th
 }else if(schedMode==1){
	m=((date.getHours()+14)*60+date.getMinutes()+so)/4
	r=(iRng/2)*Math.sin(Math.PI*(180-m)/180)
	tt=r+iMin+th+iRng/2
 }else if(schedMode==2){
	tt=iMin+th
 }
 o=70+ct*2
 return h18-o/2-(h18-o)/iRng*(tt-iMin)
}
function setSched(n)
{
 schedMode=n
 setVar('sm',n)
 if(n==0) a.fco.value=fco
 else a.fco.value=so
 drawFC()
}
function setShift(n)
{
 if(schedMode==0) fco=n
 else so=n
 setVar('fco',n)
 drawFC()
}
</script>
